# Reach Sphynx from anywhere. Use together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.internet.yml up -d --build
#
# Forward these ports on your router to this PC, point a domain name at
# your home IP (a free dynamic-DNS name works) and turn on HTTPS in
# Settings. README.md walks through it.
services:
  sphynx:
    ports:
      # Let's Encrypt certificate checks and the redirect to HTTPS.
      - "80:80"
      # Devices, the built-in relay (DERP) and public shares.
      - "443:443"
      # STUN for the built-in relay: helps devices find direct paths.
      - "3478:3478/udp"
      # Uncomment if you set a peer relay port in Settings > Sphynx home.
      # - "40000:40000/udp"
