# Sphynx: your own Tailscale-compatible private network, with a web UI.
#
#   docker compose up -d --build
#   then open http://localhost:3000 on this PC
#
# This file is enough for devices on your home network. To reach Sphynx
# from anywhere, also use docker-compose.internet.yml (see README.md).
name: sphynx

services:
  sphynx:
    build: .
    image: sphynx:local
    container_name: sphynx
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Optional: preset the admin password instead of choosing it on first visit.
      SPHYNX_ADMIN_PASSWORD: ${SPHYNX_ADMIN_PASSWORD:-}
      # Optional: preset the address devices use, e.g. http://192.168.1.20:8080
      SPHYNX_SERVER_URL: ${SPHYNX_SERVER_URL:-}
    ports:
      # Admin web UI. Only this PC can open it; other devices use the
      # tailnet address http://sphynx-home:3000 once they're connected.
      # Change to "3000:3000" to open it to your whole home network.
      - "127.0.0.1:3000:3000"
      # Sphynx Chat on this PC, at http://localhost:3001 (you chat as
      # Sphynx home). Devices open it at http://sphynx-home/ instead.
      - "127.0.0.1:3001:3001"
      # Devices connect here when HTTPS is off.
      - "8080:8080"
      # Sphynx home's WireGuard port, for fast direct connections to the
      # built-in exit node. Forward it on your router too.
      - "41641:41641/udp"
    volumes:
      - sphynx-data:/data
    # Radio mode with a Meshtastic radio plugged in by USB (Linux only):
    # uncomment, and use the radio's port (ls /dev/ttyUSB* /dev/ttyACM*).
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

volumes:
  sphynx-data:
